
name: Deploy Website

on:
  push:
    branches:
      - master
      - vpk-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Production
        uses: actions/checkout@v4
        with:
          ref: master
          path: site

      - name: Checkout Beta
        uses: actions/checkout@v4
        with:
          ref: vpk-test
          path: site/beta

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
