	  	function addTemplate(name)
	  	{
            templateList.addTemplate(name);
  	    }
	  	function LoadTemplate(userDatas)
	  	{
   	    	globalPopulation.loadXml(xmlDoc, userDatas);
   	    }
	  	function LoadXML(url)
	  	{
			var xmlhttp = new XMLHttpRequest();
			xmlhttp.open("GET", url, false);
			xmlhttp.setRequestHeader('Content-Type', 'text/xml');
			xmlhttp.send("");
			if (xmlhttp.status === 200) {
				xmlDoc = xmlhttp.responseXML;
				return xmlDoc != null;
			}
			return false;
   	    }
	  	function LoadPopFile(fileOrText)
	  	{
			if (typeof File !== "undefined" && fileOrText instanceof File) {
				var reader = new FileReader();
				reader.onload = function() {
					LoadPopFile(reader.result);
				};
				reader.onerror = function() {
					alert("failed loading file");
				};
				reader.readAsText(fileOrText);
				return;
			}
			if (typeof fileOrText === "string") {
				var parsed = (typeof PopFileParser !== "undefined") ? PopFileParser.parseToXmlDoc(fileOrText) : null;
				if (parsed) {
					_LoadPopXmlDoc(parsed);
					return;
				}
				alert("failed loading file");
				return;
			}
			var fileInput = document.getElementById("popfile");
			var fallbackFile = (fileInput && fileInput.files) ? fileInput.files[0] : null;
			if (fallbackFile) {
				LoadPopFile(fallbackFile);
				return;
			}
			alert("failed loading file");
	   	}
		function bindPopFileUpload() {
			var form = document.getElementById("sendfile");
			var input = document.getElementById("popfile");
			if (!form || !input) {
				return;
			}
			var handler = function(event) {
				if (event && event.preventDefault) {
					event.preventDefault();
				}
				var file = input.files ? input.files[0] : null;
				if (file) {
					LoadPopFile(file);
				} else {
					alert("failed loading file");
				}
				return false;
			};
			if (typeof addEvent === "function") {
				addEvent(form, "submit", handler, false);
				addEvent(input, "change", handler, false);
			} else {
				form.addEventListener("submit", handler);
				input.addEventListener("change", handler);
			}
		}
	  	function _LoadPopFile(file)
	  	{
			globalPopulation.clear();
			if (LoadXML(file)) {
    			LoadTemplate(true);
			}
   	    }
	  	function _LoadPopXmlDoc(newXmlDoc)
	  	{
			globalPopulation.clear();
			xmlDoc = newXmlDoc;
			LoadTemplate(true);
	  	}
	  	function LoadLastSaved()
	  	{
			globalPopulation.clear();
			if (LoadXML("./popfile/getlastsaved.php")) {
    			LoadTemplate(true);
			}
   	    }
	  	function IframeLoaded()
	  	{
			var iframe = document.getElementById("hiddenmyiframe");
			var response = iframe.contentDocument.childNodes[0].nodeName;
			switch (response) {
				case "ok":
					LoadPopFile();
					break;
				case "ko":
					alert("failed loading file");
					break;
				case "saveok":
					alert(ALERT_SAVE_OK);
					break;
				case "saveko":
					alert(ALERT_SAVE_KO);
					break;
				case "genok":
					alert(ALERT_GEN_OK);
					break;
				case "genko":
					alert(ALERT_GEN_KO);
					break;
				case "loadlastko":
					alert(ALERT_LOAD_LAST_KO);
					break;
			}
  	    }
		function KeyDown(event) {
			if (event.keyCode==112) globalHelp.setActive();
		}
		function KeyUp(event) {
			if (event.keyCode==112) globalHelp.setInactive();
		}

		/*LoadXML("xml/templates.xml");

    	window.addEventListener("keyup", KeyUp, false);
